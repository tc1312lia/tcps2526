<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCPS Annual Report FY25/26</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }

        .mobile-link {
            display: none;
            padding: 30px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .mobile-link a {
            display: inline-block;
            padding: 14px 20px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            iframe {
                display: none;
            }

            .mobile-link {
                display: block;
            }
        }
    </style>
</head>

<body>

    <iframe
        src="./TCPS_AR.pdf"
        title="TCPS Annual Report FY25/26">
    </iframe>

    <div class="mobile-link">
        <p>View the full TCPS Annual Report:</p>

        <a href="./TCPS_AR.pdf">
            Open Annual Report
        </a>
    </div>

    <!-- Website analytics -->
    <script
        data-goatcounter="https://tcps.goatcounter.com/count"
        async
        src="https://gc.zgo.at/count.js">
    </script>

</body>
</html>
